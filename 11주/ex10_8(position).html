<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #parent {
        width: 500px;
        height: 300px;
        border: solid 5px #000000;
        margin: 50px 0 0 50px;
        position: relative;
        }   
        #box1, #box2, #box3 {
            width: 80px;
            height: 80px;
        }
        #box1 {
            background-color: rgb(223, 42, 42);
        }
        #box2 {
            background-color: rgb(83, 170, 83);
            position: relative;
            top: 20px;
            left: 30px;
        }
        #box3 {
            background-color: rgb(227, 227, 0);
            position: absolute;
            top:10px;
            left: 30px;
        }
    </style>
</head>
<body>
    <div id="parent">
        <div id="box1">A</div>
        <div id="box2">B</div>
        <div id="box3">C</div>
    </div>
</body>
</html>
