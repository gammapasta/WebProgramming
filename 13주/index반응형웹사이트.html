<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            box-sizing: border-box;
        }

        body{
            font-family: Arial;
            padding: 10px;
            background-color: #f1f1f1;
        }

        header{
            padding: 30px;
            text-align: center;
            background-color: white;
        }
        header h1{
            font-size: 50px;
        }
        .topnav{
            overflow: hidden;
            background-color: #333333;
        }
        .topnav a{
            float: left;
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        .topnav a:hover{
            background-color: #dddddd;
            color: black;
        }

        .leftcolumn{
            float: left;
            width: 75%;
        }
        .rightcolumn{
            float: left;
            width: 25%;
            background-color: #f1f1f1;
            padding-left: 25px;
        }
        .fakeimg{
            background-color: #aaaaaa;
            width: 100%;
            padding: 20px;
        }
        .card{
            background-color: white;
            padding: 20px;
            margin-top: 20px;
        }
        /* clear floats after the columns*/
        .row:after{
            content: "";
            display: table;
            clear: both;
        }

        footer{
            padding: 20px;
            text-align: center;
            background-color: #dddddd;
            margin-top: 20px;
        }

        @media screen and (max-width: 900px) {
            .leftcolumn, .rightcolumn {
                width: 100%;
                padding: 0;
            }
        }
        @media screen and (max-width: 900px) {
            .topnav a{
                float: none;
                width: 100%;
            }
            
        }
    </style>
</head>
<body>
    <header>
        <h1>My Website</h1>
        <p>Resizeable Website</p>
    </header>

    <div class="topnav">
        <a href="#">Link</a>
        <a href="#">Link</a>
        <a href="#">Link</a>
        <a href="#" style="float: right;">Link</a>
    </div>

    <div class="row">
        <div class="leftcolumn">
            <div class="card">
                <h2>TITLE HEADING</h2>
                <h5>Title description, May</h5>
                <div class="fakeimg" style="height: 200px;">Image</div>
                <p>some text</p>
                <p>jdasjdlkasjkldaskldjklaskldl</p>
            </div>
        </div>
        <div class="rightcolumn">
            <div class="card">
                <h2>About Me</h2>
                <div class="fakeimg" style="height: 100px;">Image</div>
                <p>some text about me</p>
            </div>
            <div class="card">
                <h3>Popular Post</h3>
                <div class="fakeimg"><p>Image</p></div>
                <div class="fakeimg"><p>Image</p></div>
                <div class="fakeimg"><p>Image</p></div>
            </div>
            <div class="card">
                <h3>Follow me</h3>
                <p>some text</p>
            </div>
        </div>
    </div>
    
    <footer>
        <h2>Footer</h2>
    </footer>
</body>
</html>
