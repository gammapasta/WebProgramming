<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #warp {
            width: 980px;
            margin:0 auto;
        }

        header {
            height: 80px;
            background-color: #cccccc;
        }
        aside {
            width: 200px;
            height: 300px;
            float: left;
            background-color: #ffff00;
        }
        main {
            width: 780px;
            height: 300px;
            float: left;
            background-color: #ff0000;
        }
        footer {
           height: 80px;
           clear: both;
            background-color: #cccccc;
        }
    </style>
</head>
<body>
    <div id="warp">
        <header>
            헤더
        </header>
        <aside>
            좌측콘텐츠
        </aside>
        <main>
            메인
        </main>
        <footer>
            푸터
        </footer>
    </div>
</body>
</html>
